name: Idea
description: Suggest an improvement or a new feature
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, slow or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Screenshots or examples welcome.
