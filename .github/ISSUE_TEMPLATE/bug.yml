name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste an API key, a token or private code here."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
  - type: dropdown
    id: mode
    attributes:
      label: Connection
      options:
        - Claude subscription
        - API key
  - type: input
    id: app
    attributes:
      label: Baguette version
      description: Settings → bottom of the page
