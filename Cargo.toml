[workspace]
resolver = "2"
members = ["crates/baguette-core", "crates/fake-claude", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "FSL-1.1-ALv2"
rust-version = "1.85"

[workspace.dependencies]
baguette-core = { path = "crates/baguette-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync", "fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
tempfile = "3"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
