[package]
name = "baguette-desktop"
description = "Desktop app (Tauri 2) around the baguette-core engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "baguette_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
baguette-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
